name: Build install file

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        shell: bash
        run: gradle --no-daemon assembleRelease 2>&1 | tee build.log
      - name: Save the log if the build failed
        if: failure()
        run: |
          git config user.name "build"
          git config user.email "build@users.noreply.github.com"
          git checkout -B build-log
          git add -f build.log
          git commit -m "Build log for run ${{ github.run_number }}"
          git push -f origin build-log
      - name: Name the install file
        run: cp app/build/outputs/apk/release/app-release.apk NearbyLists.apk
      - name: Publish the install file
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nearby Lists build ${{ github.run_number }}
          files: NearbyLists.apk
